# Production-shaped stack: API + ingestion worker + maintenance scheduler + PostgreSQL + Redis + Qdrant.
# (Not executed in the build environment - no container runtime was available there; `docker compose config` and the Dockerfile are validated in CI.)
#   cp .env.example .env   # set MKA_JWT_SECRET, OPENAI_API_KEY (optional), passwords
#   docker compose up --build
# First tenant:  docker compose exec api python -m app.cli create-tenant --name "ACME" --email admin@acme.com
x-app: &app
  build: .
  env_file: [ { path: .env, required: false } ]
  environment:
    MKA_ENV: production
    MKA_AUTH_ENABLED: "true"
    MKA_ALLOW_SIGNUP: "false"
    MKA_DATABASE_URL: postgresql+psycopg2://mka:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mka
    MKA_REDIS_URL: redis://redis:6379/0
    MKA_JOB_BACKEND: redis
    MKA_VECTOR_STORE: qdrant
    MKA_QDRANT_URL: http://qdrant:6333
    MKA_CHECKPOINT_BACKEND: postgres
    MKA_DATA_DIR: /data
    MKA_AUTO_MIGRATE: "true"          # alembic upgrade head at start (PostgreSQL advisory lock: safe with several replicas)
  volumes: [ "mka-data:/data" ]   # shared: the API stages uploads here, the worker reads them
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    qdrant: { condition: service_healthy }

services:
  api:
    <<: *app
    ports: [ "8000:8000" ]
  worker:
    <<: *app
    command: [ "python", "-m", "app.worker" ]
    healthcheck: { disable: true }
  scheduler:                      # retention sweeps + housekeeping; one leader at a time (Redis lock), safe to run several replicas
    <<: *app
    command: [ "python", "-m", "app.scheduler" ]
    healthcheck: { disable: true }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mka, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: mka }
    volumes: [ "pg-data:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U mka" ], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes: [ "redis-data:/data" ]
    healthcheck: { test: [ "CMD", "redis-cli", "ping" ], interval: 5s, timeout: 3s, retries: 10 }
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [ "qdrant-data:/qdrant/storage" ]
    healthcheck: { test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1" ], interval: 10s, timeout: 3s, retries: 10 }

volumes: { mka-data: {}, pg-data: {}, redis-data: {}, qdrant-data: {} }
