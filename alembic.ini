[alembic]
script_location = migrations
prepend_sys_path = .
# the database URL comes from MKA_DATABASE_URL / MKA_DATA_DIR (see migrations/env.py); override with:  alembic -x url=postgresql+psycopg2://... upgrade head

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
