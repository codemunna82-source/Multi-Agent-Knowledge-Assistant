apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mka.name" . }}-worker
  labels: {{ include "mka.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "mka.pod" (dict "root" . "component" "worker" "resources" .Values.worker.resources "command" (list "python" "-m" "app.worker") ) | nindent 6 }}
