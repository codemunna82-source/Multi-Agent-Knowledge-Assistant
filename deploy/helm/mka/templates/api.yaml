apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mka.name" . }}-api
  labels: {{ include "mka.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- include "mka.pod" (dict "root" . "component" "api" "resources" .Values.api.resources  "port" true) | nindent 6 }}
